spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/msa
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: delivery_schema

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: delivery_schema
    default-schema: delivery_schema

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka