services:
  postgres:
    image: postgres:16
    container_name: delivery-postgres
    environment:
      POSTGRES_DB: msa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - delivery_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

volumes:
  delivery_postgres_data: